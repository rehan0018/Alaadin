version: '3.8'

services:
  recoverai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recoverai_engine
    ports:
      - "8000:8000"
    environment:
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
    restart: unless-stopped
